---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-deployment
  namespace: meu-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meu-app
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: meu-app
    spec:
      containers:
        - name: nginx
          image: nginx
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
